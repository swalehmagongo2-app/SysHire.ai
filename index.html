<script>
  const SUPABASE_URL = 'https://nqzheisihfkxrafjcfou.supabase.co';

  const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_Zv5LN6xVegJnre30s2DUxg_HDs6nTaF';

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  console.log('Supabase client initialized');
  async function document.addEventListener('DOMContentLoaded', testSupabaseConnection); {
  const status = document.createElement('div');

  status.style.position = 'fixed';
  status.style.bottom = '20px';
  status.style.left = '20px';
  status.style.right = '20px';
  status.style.zIndex = '99999';
  status.style.padding = '15px';
  status.style.borderRadius = '10px';
  status.style.fontFamily = 'Arial, sans-serif';
  status.style.fontSize = '14px';
  status.style.fontWeight = 'bold';
  status.style.background = '#111827';
  status.style.color = 'white';

  status.textContent = 'Testing Supabase connection...';

  document.body.appendChild(status);

  const { data, error } = await supabaseClient
    .from('organizations')
    .select('*')
    .limit(1);

  if (error) {
    status.textContent = 'Supabase Error: ' + error.message;
    status.style.background = '#991b1b';
    console.error('Supabase error:', error);
    return;
  }

  status.textContent = 'Supabase Connected Successfully!';
  status.style.background = '#166534';

  console.log('Supabase connection successful:', data);

  setTimeout(() => {
    status.remove();
  }, 5000);
}

testSupabaseConnection();
</script>

    // ===================== STORE =====================
    const store = {
      key: 'syshire_v1',
      get() {
        try { return JSON.parse(localStorage.getItem(this.key)) || {}; }
        catch { return {}; }
      },
      set(data) { localStorage.setItem(this.key, JSON.stringify(data)); },
      users() { return this.get().users || {}; },
      saveUsers(u) { const s = this.get(); s.users = u; this.set(s); },
      company() { return this.get().company || null; },
      saveCompany(c) { const s = this.get(); s.company = c; this.set(s); },
      session() { return this.get().session || null; },
      login(email) {
        const s = this.get();
        s.session = { email, loggedInAt: Date.now() };
        this.set(s);
      },
      logout() {
        const s = this.get();
        delete s.session;
        this.set(s);
      },
      isLoggedIn() { return !!this.session(); },
      addNotification(msg, type = 'info') {
        const c = this.company();
        if (!c) return;
        c.notifications = c.notifications || [];
        c.notifications.unshift({ id: Date.now(), msg, type, time: new Date().toISOString(), read: false });
        if (c.notifications.length > 50) c.notifications = c.notifications.slice(0, 50);
        this.saveCompany(c);
      },
      markNotificationsRead() {
        const c = this.company();
        if (!c || !c.notifications) return;
        c.notifications.forEach(n => n.read = true);
        this.saveCompany(c);
      },
      recordTask(deptId, description) {
        const c = this.company();
        if (!c) return;
        c.tasks = c.tasks || [];
        c.tasks.unshift({ id: Date.now(), dept: deptId, description, time: new Date().toISOString() });
        c.stats = c.stats || { tasksCompleted: 0, hoursSaved: 0, moneySaved: 0 };
        c.stats.tasksCompleted += 1;
        c.stats.hoursSaved += Math.round((0.5 + Math.random() * 1.5) * 10) / 10;
        c.stats.moneySaved += Math.round(15 + Math.random() * 40);
        this.saveCompany(c);
      }
    };

    function toast(msg, type = 'success') {

      el.className = `${colors[type] || colors.info} text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium animate-in max-w-sm`;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 3200);
    }

    function formatMoney(n) { return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n); }
    function formatDate(iso) {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return 'Just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return d.toLocaleDateString();
    }

      return AppShell(`
        <div class="mb-8">
          <h1 class="text-2xl font-bold">Settings</h1>
          <p class="text-slate-500 mt-1">Manage your company profile.</p>
        </div>
        <form id="settings-form" class="bg-white rounded-2xl border border-slate-200 p-6 max-w-xl space-y-5">
          <div>
            <label class="block text-sm font-medium mb-1.5">Company Name</label>
            <input name="name" required value="${c.name || ''}" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">Industry</label>
            <select name="industry" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none">
              ${INDUSTRIES.map(i => `<option value="${i}" ${c.industry===i?'selected':''}>${i}</option>`).join('')}
            </select>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1.5">Company Size</label>
              <select name="size" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none">
                ${SIZES.map(s => `<option value="${s}" ${c.size===s?'selected':''}>${s}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium mb-1.5">Country</label>
              <input name="country" value="${c.country || ''}" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none" />
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">Time Zone</label>
            <select name="timezone" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none">
              ${TIMEZONES.map(t => `<option value="${t}" ${c.timezone===t?'selected':''}>${t}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">Website</label>
            <input name="website" value="${c.website || ''}" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-brand-500 outline-none" />
          </div>
          <button type="submit" class="gradient-bg text-white font-semibold px-6 py-2.5 rounded-xl hover:opacity-90">Save Changes</button>
        </form>
      `, 'settings');
    }

    function Notifications() {
      const c = store.company();
      if (!c) return '';
      const notes = c.notifications || [];
      store.markNotificationsRead();
      return AppShell(`
        <div class="mb-8">
          <h1 class="text-2xl font-bold">Notifications</h1>
          <p class="text-slate-500 mt-1">Updates from your AI departments.</p>
        </div>
        <div class="bg-white rounded-2xl border border-slate-200 divide-y divide-slate-100">
          ${notes.length === 0
            ? `<div class="p-10 text-center text-slate-400">No notifications yet.</div>`
            : notes.map(n => `
              <div class="p-4 flex gap-3 ${n.read ? '' : 'bg-brand-50/50'}">
                <div class="w-2 h-2 mt-2 rounded-full ${n.type==='success'?'bg-emerald-500':n.type==='error'?'bg-red-500':'bg-brand-500'} shrink-0"></div>
                <div class="flex-1">
                  <div class="text-sm font-medium">${n.msg}</div>
                  <div class="text-xs text-slate-400 mt-0.5">${formatDate(n.time)}</div>
                </div>
              </div>
            `).join('')
          }
        </div>
      `, 'dashboard');
    }

    // ===================== ACTIONS =====================
    function deployDept(id) {
      const c = store.company();
      const plan = PLANS[c.plan] || PLANS.free;
      if (c.deployed.includes(id)) return;
      if (c.deployed.length >= plan.depts) {
        toast('Plan limit reached. Upgrade to deploy more.', 'error');
        navigate('billing');
        return;
      }
      c.deployed.push(id);
      store.saveCompany(c);
      const d = DEPARTMENTS[id];
      store.addNotification(`${d.name} department deployed with ${d.employees.length} AI employees`, 'success');
      store.recordTask(id, `${d.name} department activated and ready`);
      toast(`${d.name} deployed successfully!`);
      render();
    }

    function changePlan(planId) {
      const c = store.company();
      c.plan = planId;
      store.saveCompany(c);
      store.addNotification(`Plan changed to ${(PLANS[planId]||{}).name}`, 'success');
      toast(`Switched to ${PLANS[planId].name} plan`);
      render();
    }

    function toggleIntegration(id) {
      const c = store.company();
      c.integrations = c.integrations || [];
      const idx = c.integrations.indexOf(id);
      if (idx >= 0) {
        c.integrations.splice(idx, 1);
        toast('Integration disconnected');
      } else {
        c.integrations.push(id);
        const name = INTEGRATIONS.find(i => i.id === id)?.name || id;
        store.addNotification(`${name} connected`, 'success');
        toast(`${name} connected`);
      }
      store.saveCompany(c);
      render();
    }

    function removeTeamMember(idx) {
      const c = store.company();
      c.team.splice(idx, 1);
      store.saveCompany(c);
      toast('Team member removed');
      render();
    }

    function simulateTask(deptId) {
      const d = DEPARTMENTS[deptId];
      const samples = {
        sales: ['Qualified new inbound lead from website', 'Drafted proposal for Acme Corp', 'Scheduled discovery call with prospect'],
        support: ['Resolved ticket #4821 automatically', 'Escalated complex billing issue to human', 'Generated weekly support summary'],
        marketing: ['Published 3 social posts for product launch', 'Drafted blog post outline', 'Created email campaign sequence'],
        hr: ['Screened 12 candidate applications', 'Scheduled 4 interviews for next week', 'Answered 8 employee policy questions'],
        finance: ['Generated invoice INV-2026-0842', 'Flagged unusual expense report', 'Produced monthly budget variance report'],
        operations: ['Assigned 6 tasks across project Alpha', 'Summarized standup meeting notes', 'Updated workflow status board']
      };
      const list = samples[deptId] || ['Completed routine AI task'];
      const desc = list[Math.floor(Math.random() * list.length)];
      store.recordTask(deptId, desc);
      store.addNotification(`${d.name}: ${desc}`, 'info');
      toast('AI task completed');
      render();
    }

    function runWorkflow() {
      const c = store.company();
      const sequence = [
        { dept: 'sales', msg: 'Sales AI qualified new lead "TechNova"' },
        { dept: 'finance', msg: 'Finance AI generated quotation QT-8841' },
        { dept: 'operations', msg: 'Operations AI created project "TechNova Onboarding"' },
        { dept: 'support', msg: 'Support AI prepared customer onboarding checklist' }
      ].filter(s => c.deployed.includes(s.dept));
      if (sequence.length < 2) {
        toast('Deploy at least 2 related departments to run workflow', 'info');
        return;
      }
      sequence.forEach((s, i) => {
        setTimeout(() => {
          store.recordTask(s.dept, s.msg);
          store.addNotification(s.msg, 'success');
          if (i === sequence.length - 1) {
            store.addNotification('Manager: Cross-department workflow completed', 'info');
            toast('Workflow completed across departments!');
            render();
          }
        }, i * 600);
      });
      toast('Running AI collaboration workflow…', 'info');
    }

    // ===================== BIND EVENTS =====================
    function bindEvents() {
      const signup = document.getElementById('signup-form');

if (signup) {
  signup.onsubmit = async (e) => {
    e.preventDefault();

    const fd = new FormData(signup);

    const company = fd.get('company').trim();
    const email = fd.get('email').toLowerCase().trim();
    const password = fd.get('password');

    try {
      // 1. Create the user in Supabase Auth
      const { data: authData, error: authError } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });

      if (authError) {
        toast(authError.message, 'error');
        console.error('Signup error:', authError);
        return;
      }

      const user = authData.user;

      if (!user) {
        toast('Account could not be created.', 'error');
        return;
      }

      // 2. Create the organization
      const { data: organization, error: organizationError } =
        await supabaseClient
          .from('organizations')
          .insert({
            name: company,
            owner_id: user.id,
            plan: 'free',
            status: 'active'
          })
          .select()
          .single();

      if (organizationError) {
        console.error('Organization error:', organizationError);
        toast('User created, but company setup failed.', 'error');
        return;
      }

      // 3. Create the profile
      const { error: profileError } =
        await supabaseClient
          .from('profiles')
          .insert({
            id: user.id,
            full_name: '',
            email: email,
            role: 'owner',
            organization_id: organization.id
          });

      if (profileError) {
        console.error('Profile error:', profileError);
        toast('Profile setup failed.', 'error');
        return;
      }

      // 4. Add the user as organization owner
      const { error: memberError } =
        await supabaseClient
          .from('organization_members')
          .insert({
            organization_id: organization.id,
            user_id: user.id,
            role: 'owner',
            status: 'active'
          });

      if (memberError) {
        console.error('Membership error:', memberError);
        toast('Organization membership setup failed.', 'error');
        return;
      }

      // 5. Keep the local company object for the existing UI
      const c = defaultCompany();
      c.name = company;
      c.email = email;
      c.plan = 'free';
      store.saveCompany(c);

      // 6. Email confirmation is enabled in your Supabase project
      if (!authData.session) {
        toast(
          'Account created! Check your email to confirm your account.',
          'success'
        );

        navigate('login');
        return;
      }

      // 7. If confirmation isn't required, continue normally
      store.login(email);
      store.addNotification(
        'Welcome to Syshire! Complete your company setup.',
        'success'
      );

      toast('Account created!', 'success');
      navigate('setup');

    } catch (error) {
      console.error('Unexpected signup error:', error);
      toast('Something went wrong during signup.', 'error');
    }
  };
      }

      const login = document.getElementById('login-form');
      if (login) {
        login.onsubmit = (e) => {
          e.preventDefault();
          const fd = new FormData(login);
          const email = fd.get('email').toLowerCase().trim();
          const password = fd.get('password');
          const users = store.users();
          if (!users[email] || users[email].password !== password) {
            toast('Invalid email or password', 'error');
            return;
          }
          store.login(email);
          let c = store.company();
          if (!c || c.email !== email) {
            c = defaultCompany();
            c.name = users[email].company;
            c.email = email;
            store.saveCompany(c);
          }
          toast('Welcome back!');
          if (!c.industry) navigate('setup');
          else navigate('dashboard');
        };
      }

      const setup = document.getElementById('setup-form');
      if (setup) {
        setup.onsubmit = (e) => {
          e.preventDefault();
          const fd = new FormData(setup);
          const c = store.company();
          c.name = fd.get('name').trim();
          c.industry = fd.get('industry');
          c.size = fd.get('size');
          c.country = fd.get('country').trim();
          c.timezone = fd.get('timezone');
          c.website = fd.get('website') || '';
          store.saveCompany(c);
          store.addNotification('Company profile completed', 'success');
          toast('Setup complete!');
          navigate('departments');
        };
      }

      const settings = document.getElementById('settings-form');
      if (settings) {
        settings.onsubmit = (e) => {
          e.preventDefault();
          const fd = new FormData(settings);
          const c = store.company();
          c.name = fd.get('name').trim();
          c.industry = fd.get('industry');
          c.size = fd.get('size');
          c.country = fd.get('country').trim();
          c.timezone = fd.get('timezone');
          c.website = fd.get('website') || '';
          store.saveCompany(c);
          toast('Settings saved');
          render();
        };
      }

      const invite = document.getElementById('invite-form');
      if (invite) {
        invite.onsubmit = (e) => {
          e.preventDefault();
          const fd = new FormData(invite);
          const email = fd.get('email').toLowerCase().trim();
          const c = store.company();
          c.team = c.team || [];
          if (c.team.some(m => m.email === email)) {
            toast('Already invited', 'error');
            return;
          }
          c.team.push({ email, role: 'Member', invitedAt: new Date().toISOString() });
          store.saveCompany(c);
          store.addNotification(`Invitation sent to ${email}`, 'success');
          toast('Invitation sent');
          invite.reset();
          render();
        };
      }
    }

    // ===================== RENDER =====================
    function render() {
      const app = document.getElementById('app');
      const loggedIn = store.isLoggedIn();
      const c = store.company();

      if (!loggedIn && !['landing', 'signup', 'login'].includes(currentView)) {
        currentView = 'landing';
      }
      if (loggedIn && ['landing', 'signup', 'login'].includes(currentView)) {
        currentView = c?.industry ? 'dashboard' : 'setup';
      }

      let html = '';
      switch (currentView) {
        case 'landing': html = Landing(); break;
        case 'signup': html = Signup(); break;
        case 'login': html = Login(); break;
        case 'setup': html = Setup(); break;
        case 'departments': html = Departments(); break;
        case 'department': html = DepartmentDetail(); break;
        case 'dashboard': html = Dashboard(); break;
        case 'billing': html = Billing(); break;
        case 'integrations': html = Integrations(); break;
        case 'admin': html = Admin(); break;
        case 'settings': html = Settings(); break;
        case 'notifications': html = Notifications(); break;
        default: html = loggedIn ? Dashboard() : Landing();
      }
      app.innerHTML = html;
      bindEvents();
    }

    window.navigate = navigate;
    window.deployDept = deployDept;
    window.changePlan = changePlan;
    window.toggleIntegration = toggleIntegration;
    window.removeTeamMember = removeTeamMember;
    window.simulateTask = simulateTask;
    window.runWorkflow = runWorkflow;
    window.store = store;

    (function init() {
      const hash = window.location.hash.slice(1) || '';
      if (hash) {
        const [view, qs] = hash.split('?');
        currentView = view || 'landing';
        viewParams = Object.fromEntries(new URLSearchParams(qs || ''));
      }
      render();
    })();
</script>

</body>
</html>
